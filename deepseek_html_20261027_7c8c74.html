<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRASTTA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 400px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 5px;
            margin-top: 0;
            margin-bottom: 5px; 
            text-transform: uppercase;
        }

        /* Обновленный стиль описания: темнее, крупнее, чуть жирнее */
        .subtitle {
            text-align: center;
            color: #4a4a4a; /* Темно-серый цвет (было #777) */
            font-size: 15px; /* Увеличили размер (было 13px) */
            font-weight: 500; /* Добавили небольшую жирность */
            margin-top: 0;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        
        .input-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
            align-items: flex-start;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        input.error {
            border-color: #e53935;
        }

        .error-message {
            color: #e53935;
            font-size: 12px;
            margin-top: 4px;
            margin-left: 2px;
            display: none;
        }
        .error-message.show {
            display: block;
        }

        .add-btn {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            height: 38px;
        }
        .add-btn:hover {
            background-color: #218838;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }
        li {
            background: #f9f9f9;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #eee;
            display: grid;
            grid-template-columns: 20px 1fr 20px; 
            align-items: center;
            gap: 10px;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin: 0;
        }
        li span {
            word-break: break-word; 
            line-height: 1.2;
        }
        li.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .delete-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #e53935; 
            padding: 0;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
        }
        .delete-btn:hover {
            color: #b71c1c; 
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>GRASTTA</h2>
        <p class="subtitle">Твой помощник на пути к дисциплине, целям, прогрессу и новым рекордам!</p>
        
        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="taskInput" maxlength="35" placeholder="Новая цель" oninput="checkLength()">
                <div id="errorMsg" class="error-message">Достигнут лимит символов!</div>
            </div>
            <button type="button" class="add-btn" onclick="addTask()">Добавить цель</button>
        </div>

        <ul id="taskList">
            <li class="completed">
                <input type="checkbox" checked onchange="toggleTask(this)">
                <span>Пробежка 5 км и еще одна длинная задача</span>
                <button type="button" class="delete-btn" onclick="deleteTask(this)">✕</button>
            </li>
            <li>
                <input type="checkbox" onchange="toggleTask(this)">
                <span>Купить воды</span>
                <button type="button" class="delete-btn" onclick="deleteTask(this)">✕</button>
            </li>
        </ul>
    </div>

    <script>
        function checkLength() {
            let input = document.getElementById('taskInput');
            let errorMsg = document.getElementById('errorMsg');

            if (input.value.length >= 35) {
                errorMsg.classList.add('show');
                input.classList.add('error');
            } else {
                errorMsg.classList.remove('show');
                input.classList.remove('error');
            }
        }

        function addTask() {
            let input = document.getElementById('taskInput');
            let taskText = input.value.trim();

            if (taskText === '') return;

            if (taskText.length > 35) {
                return;
            }

            let li = document.createElement('li');
            
            li.innerHTML = `
                <input type="checkbox" onchange="toggleTask(this)">
                <span>${taskText}</span>
                <button type="button" class="delete-btn" onclick="deleteTask(this)">✕</button>
            `;

            document.getElementById('taskList').appendChild(li);
            
            input.value = '';
            checkLength();
        }

        function toggleTask(checkbox) {
            let li = checkbox.parentElement;
            if (checkbox.checked) {
                li.classList.add('completed');
            } else {
                li.classList.remove('completed');
            }
        }

        function deleteTask(button) {
            let li = button.parentElement;
            li.remove();
        }
    </script>

</body>
</html>
